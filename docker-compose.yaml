# Single deployment file. Every tunable lives here; only the ntfy topic is supplied
# at runtime, because it is a credential - anyone holding it can read your alerts
# and publish to your phone.
#
#   export NTFY_TOPIC=your-secret-topic
#   docker compose up -d --build
#
# A local .env file containing NTFY_TOPIC=... also works; it is gitignored.

services:
  watcher:
    build: .
    image: casio-price-alerts:1.0.0
    container_name: casio-price-alerts
    restart: unless-stopped

    environment:
      # Required. Compose refuses to start if it is unset, rather than launching a
      # watcher that polls correctly and can never deliver anything.
      NTFY_TOPIC: ${NTFY_TOPIC:?set NTFY_TOPIC to your ntfy topic before starting}

      NTFY_SERVER: https://ntfy.sh
      MIN_DISCOUNT_PCT: "10"
      POLL_SECONDS: "60"

      # Whole store is polled; this narrows it. "*" means every type.
      PRODUCT_TYPES: Watches

      # Exact product titles to alert on the moment they are back in stock.
      WATCHLIST: "F-91W-1,F-91WF-1ADF,F-91WF-2ADF,GBD-200UU-1"
      LOG_LEVEL: INFO
      STATE_PATH: /data/state.json
      HEARTBEAT_PATH: /tmp/heartbeat

    volumes:
      - state:/data

    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import os, sys, time
          p = os.environ["HEARTBEAT_PATH"]
          sys.exit(0 if os.path.exists(p) and time.time() - float(open(p).read()) < 300 else 1)
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  state:
